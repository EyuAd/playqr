name: Quality checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit and API validation
        run: npm test
      - name: Frontend production build
        run: npm run build
      - name: Worker dry-run build
        run: npm run worker:build
      - name: Isolated account authorization checks
        run: npm run test:accounts
      - name: Bundled Worker authentication check
        run: node tests/runtime-auth.mjs
      - name: Install Chrome on the isolated CI runner
        run: npx playwright install --with-deps chrome
      - name: Mocked browser regressions
        run: npm run test:browser
      - name: Keep regression screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-regression-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
