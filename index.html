    <script>
      try {
        const preference =
          localStorage.getItem("playqr-theme") ||
          JSON.parse(localStorage.getItem("playqr-library-v2") || "{}").theme;
        document.documentElement.dataset.theme =
          preference === "dark" ||
          (preference !== "light" &&
            matchMedia("(prefers-color-scheme: dark)").matches)
            ? "dark"
            : "light";
      } catch {
        document.documentElement.dataset.theme = matchMedia(
          "(prefers-color-scheme: dark)",
        ).matches
          ? "dark"
          : "light";
      }
    </script>
