<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#f7f8f5" />
    <meta
      name="description"
      content="Find any Android app and share it instantly. Original app icons, smart QR codes, and curated app collections."
    />
    <title>PlayQR — Good apps travel.</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='12' fill='%23142e25'/%3E%3Cpath d='M15 10v20l16-10z' fill='%23bde885'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>
    <header class="header">
      <a class="brand" href="#discover" aria-label="PlayQR home"
        ><span class="brand-mark" aria-hidden="true">▶</span>PlayQR<span
          class="brand-dot"
          >.</span
        ></a
      >
      <nav aria-label="Main navigation">
        <a href="#discover">Discover</a
        ><a href="#collections"
          >Collections <span id="collection-count"></span></a
        ><a href="#dashboard">Your library</a>
      </nav>
      <button id="theme" class="icon-button" aria-label="Switch color theme">
        ◐
      </button>
    </header>
    <div id="offline" class="offline" hidden>
      You’re offline. Saved apps are available; search and sharing need a
      connection.
    </div>
    <main id="main" tabindex="-1"></main>
    <footer>
      <a class="brand small" href="#discover">PlayQR.</a
      ><span>Good apps deserve to be shared.</span
      ><span
        >Built by
        <a href="https://github.com/EyuAd" target="_blank" rel="noopener"
          >Euael Adane ↗</a
        >
        · <a href="#privacy">Privacy</a></span
      >
    </footer>
    <div id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
